services:
  inspector:
    image: inspector-local-dev
    build:
      context: .
      dockerfile_inline: |
        FROM node:24-slim

        WORKDIR /app

        COPY . .
    container_name: inspector-local-dev
    working_dir: /app
    init: true
    stdin_open: true
    tty: true
    command: sh -lc "if [ ! -d node_modules/.bin ]; then npm ci; fi && npm run dev"
    ports:
      - "127.0.0.1:${CLIENT_PORT:-6274}:${CLIENT_PORT:-6274}"
      - "127.0.0.1:${SERVER_PORT:-6277}:${SERVER_PORT:-6277}"
    environment:
      HOST: "0.0.0.0"
      CLIENT_PORT: "${CLIENT_PORT:-6274}"
      SERVER_PORT: "${SERVER_PORT:-6277}"
      MCP_AUTO_OPEN_ENABLED: "false"
      MCP_PROXY_AUTH_TOKEN: "${MCP_PROXY_AUTH_TOKEN:-dev-token}"
      CHOKIDAR_USEPOLLING: "true"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          initial_sync: true
        - action: sync+exec
          path: package.json
          target: /app/package.json
          exec:
            command: npm i
            working_dir: /app
        - action: sync+exec
          path: package-lock.json
          target: /app/package-lock.json
          exec:
            command: npm ci
            working_dir: /app
        - action: sync+exec
          path: server/package.json
          target: /app/server/package.json
          exec:
            command: npm i
            working_dir: /app
        - action: sync+exec
          path: client/package.json
          target: /app/client/package.json
          exec:
            command: npm i
            working_dir: /app
        - action: sync+exec
          path: cli/package.json
          target: /app/cli/package.json
          exec:
            command: npm i
            working_dir: /app
