services:
  inspector:
    image: inspector-local-dev
    build:
      context: .
      dockerfile_inline: |
        FROM node:24-slim

        WORKDIR /app

        COPY . .
    container_name: inspector-local-dev
    working_dir: /app
    init: true
    stdin_open: true
    tty: true
    command: sh -lc "if [ ! -d node_modules/.bin ]; then npm ci; fi && cd clients/web && npm run dev"
    ports:
      - "127.0.0.1:${CLIENT_PORT:-6274}:${CLIENT_PORT:-6274}"
      - "127.0.0.1:${SERVER_PORT:-6277}:${SERVER_PORT:-6277}"
    environment:
      HOST: "0.0.0.0"
      CLIENT_PORT: "${CLIENT_PORT:-6274}"
      SERVER_PORT: "${SERVER_PORT:-6277}"
      MCP_AUTO_OPEN_ENABLED: "false"
      MCP_INSPECTOR_API_TOKEN: "${MCP_INSPECTOR_API_TOKEN:-dev-token}"
      ALLOWED_ORIGINS: "http://localhost:${CLIENT_PORT:-6274},http://127.0.0.1:${CLIENT_PORT:-6274},http://0.0.0.0:${CLIENT_PORT:-6274}"
      CHOKIDAR_USEPOLLING: "true"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          initial_sync: true
        - action: sync+exec
          path: package.json
          target: /app/package.json
          exec:
            command: npm i
            working_dir: /app
        - action: sync+exec
          path: package-lock.json
          target: /app/package-lock.json
          exec:
            command: npm ci
            working_dir: /app
        - action: sync+exec
          path: clients/web/package.json
          target: /app/clients/web/package.json
          exec:
            command: npm i
            working_dir: /app/clients/web
        - action: sync+exec
          path: clients/web/package-lock.json
          target: /app/clients/web/package-lock.json
          exec:
            command: npm ci
            working_dir: /app/clients/web
        - action: sync+exec
          path: clients/cli/package.json
          target: /app/clients/cli/package.json
          exec:
            command: npm i
            working_dir: /app/clients/cli
        - action: sync+exec
          path: clients/cli/package-lock.json
          target: /app/clients/cli/package-lock.json
          exec:
            command: npm ci
            working_dir: /app/clients/cli
        - action: sync+exec
          path: clients/tui/package.json
          target: /app/clients/tui/package.json
          exec:
            command: npm i
            working_dir: /app/clients/tui
        - action: sync+exec
          path: clients/tui/package-lock.json
          target: /app/clients/tui/package-lock.json
          exec:
            command: npm ci
            working_dir: /app/clients/tui
        - action: sync+exec
          path: clients/launcher/package.json
          target: /app/clients/launcher/package.json
          exec:
            command: npm i
            working_dir: /app/clients/launcher
        - action: sync+exec
          path: clients/launcher/package-lock.json
          target: /app/clients/launcher/package-lock.json
          exec:
            command: npm ci
            working_dir: /app/clients/launcher